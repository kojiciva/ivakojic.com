<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iva Kojić — The Human Side of AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      background: #15100F;
      color: #EDE4DE;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    ::selection { background: rgba(199, 125, 79, 0.32); color: #fff; }

    .page {
      --accent: #6B2D3E;
      --accent-alt: #C77D4F;
      --accent-soft: rgba(142, 52, 80, 0.22);
      --cognac-soft: rgba(199, 125, 79, 0.16);
      --bg: #15100F;
      --surface: #1E1715;
      --card: #261C1A;
      --border: #38292680;
      --border-solid: #392A27;
      --text-primary: #F1E8E2;
      --text-secondary: #B29C93;
      --text-muted: #7C6960;
    }

    /* ── Accent serif word ── */
    .accent-word, .hero-tagline em {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      background-image: linear-gradient(105deg, var(--accent-alt), #E0A878);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.01em;
    }

    /* ── Glow orbs ── */
    .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(130px);
      pointer-events: none; z-index: 0;
      animation: orbFloat 9s ease-in-out infinite alternate;
    }
    @keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(34px,-22px) scale(1.12); } }

    /* ── Nav ── */
    .top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 18px 40px; transition: background .3s, backdrop-filter .3s, box-shadow .3s, padding .3s; }
    .top-nav.scrolled { background: rgba(21,16,15,.82); backdrop-filter: blur(18px); box-shadow: 0 1px 0 rgba(255,255,255,.05); padding: 13px 40px; }
    .nav-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
    .logo-mark { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; font-size: 13px; font-weight: 800; color: #F1E8E2; background: var(--accent); letter-spacing: .02em; }
    .logo-avatar { border-radius: 50%; overflow: hidden; }
    .logo-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 16%; }
    .logo-text { color: var(--text-primary); }
    .nav-links { display: flex; align-items: center; gap: 30px; font-size: 14.5px; font-weight: 500; color: var(--text-secondary); }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-cta { padding: 9px 19px; border-radius: 9px; color: #F1E8E2 !important; font-weight: 600; background: var(--accent); white-space: nowrap; transition: filter .2s, transform .15s; }
    .nav-cta:hover { filter: brightness(1.12); transform: translateY(-1px); }

    /* ── Sections ── */
    .section { position: relative; max-width: 1240px; margin: 0 auto; padding: 120px 40px; transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
    .section-label { font-size: 12.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-alt); margin-bottom: 18px; }
    .section-heading { font-size: clamp(32px, 4.4vw, 54px); font-weight: 700; line-height: 1.08; letter-spacing: -.02em; color: var(--text-primary); }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-bottom: 52px; flex-wrap: wrap; }
    .section-head-note { max-width: 320px; font-size: 15px; color: var(--text-secondary); }

    /* ── Buttons ── */
    .btn-primary { display: inline-flex; align-items: center; padding: 15px 28px; border-radius: 11px; font-weight: 600; font-size: 15px; color: #F4ECE6; border: none; cursor: pointer; background: var(--accent); transition: filter .2s, transform .15s, box-shadow .2s; box-shadow: 0 8px 30px -12px rgba(142,52,80,.7); }
    .btn-primary:hover { filter: brightness(1.13); transform: translateY(-2px); box-shadow: 0 14px 36px -12px rgba(142,52,80,.85); }
    .btn-full { width: 100%; justify-content: center; margin-top: 4px; }
    .btn-ghost { display: inline-flex; align-items: center; padding: 15px 28px; border-radius: 11px; font-weight: 600; font-size: 15px; border: 1px solid var(--border-solid); color: var(--text-secondary); transition: border-color .2s, color .2s, background .2s; }
    .btn-ghost:hover { border-color: var(--accent-alt); color: var(--text-primary); background: rgba(199,125,79,.06); }

    /* ── Hero ── */
    .hero { position: relative; min-height: 100vh; display: flex; align-items: center; padding: 150px 40px 90px; max-width: 1240px; margin: 0 auto; transition: opacity .9s ease, transform .9s ease; }
    .hero-grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 70px 70px; mask-image: radial-gradient(ellipse 75% 70% at 35% 45%, black 10%, transparent 72%); -webkit-mask-image: radial-gradient(ellipse 75% 70% at 35% 45%, black 10%, transparent 72%); }
    .hero-wrap { position: relative; z-index: 1; display: grid; grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: center; width: 100%; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border-solid); padding: 9px 18px; border-radius: 100px; margin-bottom: 30px; }
    .eyebrow-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-alt); animation: pulse 2.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .hero-title { font-weight: 800; line-height: .9; letter-spacing: -.03em; color: var(--text-primary); margin-bottom: 22px; }
    .hero-name-1, .hero-name-2 { display: block; font-size: clamp(64px, 9.5vw, 128px); }
    .hero-name-2 { color: transparent; -webkit-text-stroke: 1.5px var(--accent-alt); }
    .hero-tagline { font-family: 'Instrument Serif', serif; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.1; color: var(--text-primary); margin-bottom: 22px; }
    .hero-desc { font-size: 16.5px; color: var(--text-secondary); max-width: 460px; margin-bottom: 34px; text-wrap: pretty; }
    .hero-actions { display: flex; gap: 13px; flex-wrap: wrap; margin-bottom: 50px; }
    .hero-stats-row { display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
    .stat-block .stat-number { font-size: 30px; font-weight: 800; color: var(--text-primary); letter-spacing: -.02em; }
    .stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; max-width: 130px; }
    .stat-divider { width: 1px; height: 40px; background: var(--border-solid); }

    /* Hero portrait */
    .hero-portrait { position: relative; }
    .portrait-frame { position: relative; aspect-ratio: 4/5; border-radius: 20px; overflow: hidden; border: 1px solid var(--border-solid); box-shadow: 0 40px 80px -30px rgba(0,0,0,.7); }
    .portrait-frame::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(21,16,15,.55)); }
    .portrait-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
    .floating-badge { position: absolute; display: flex; align-items: center; gap: 9px; background: rgba(30,23,21,.86); backdrop-filter: blur(14px); border: 1px solid var(--border-solid); border-radius: 12px; padding: 11px 16px; box-shadow: 0 14px 34px -16px rgba(0,0,0,.8); }
    .badge-1 { top: 22px; left: -26px; flex-direction: column; align-items: flex-start; gap: 1px; }
    .badge-k { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 20px; color: var(--accent-alt); line-height: 1; }
    .badge-v { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); }
    .badge-2 { bottom: 30px; right: -30px; font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-alt); }

    /* ── Marquee ── */
    .marquee-section { position: relative; z-index: 1; padding: 8px 0 30px; overflow: hidden; }
    .marquee-eyebrow { display: block; text-align: center; font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 24px; }
    .marquee-strip { overflow: hidden; mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent); }
    .marquee-track { display: flex; gap: 56px; align-items: center; width: max-content; animation: scroll 32s linear infinite; }
    @keyframes scroll { to { transform: translateX(-50%); } }
    .brand-logo { flex-shrink: 0; font-family: 'Instrument Serif', serif; font-size: 23px; color: var(--text-secondary); opacity: .55; white-space: nowrap; transition: opacity .3s, color .3s; }
    .brand-logo:hover { opacity: 1; color: var(--accent-alt); }

    /* ── About ── */
    .about-layout { display: grid; grid-template-columns: 420px 1fr; gap: 72px; align-items: center; }
    .about-photo { position: relative; }
    .about-frame { aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; border: 1px solid var(--border-solid); }
    .about-frame img { width: 100%; height: 100%; object-fit: cover; }
    .about-stamp { position: absolute; bottom: -14px; left: 24px; background: var(--accent); color: #F1E8E2; font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 9px 16px; border-radius: 100px; box-shadow: 0 10px 26px -12px rgba(142,52,80,.8); }
    .about-heading { font-size: clamp(30px, 3.8vw, 46px); font-weight: 700; line-height: 1.12; letter-spacing: -.02em; color: var(--text-primary); margin-bottom: 24px; }
    .about-body { font-size: 16.5px; color: var(--text-secondary); margin-bottom: 16px; max-width: 560px; text-wrap: pretty; }
    .about-tags { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .tag { font-size: 12.5px; font-weight: 600; letter-spacing: .03em; padding: 8px 15px; border-radius: 100px; border: 1px solid var(--border-solid); color: var(--text-secondary); transition: border-color .2s, color .2s; }
    .tag:hover { border-color: var(--accent-alt); color: var(--text-primary); }

    /* ── Quote band ── */
    .quote-band { position: relative; min-height: 520px; display: flex; align-items: center; overflow: hidden; transition: opacity .9s ease; }
    .quote-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transform: scaleX(-1); }
    .quote-overlay { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(21,16,15,.94) 30%, rgba(21,16,15,.5) 75%, rgba(107,45,62,.4)); }
    .quote-content { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 40px; width: 100%; }
    .quote-mark { font-family: 'Instrument Serif', serif; font-size: 90px; line-height: .4; color: var(--accent-alt); margin-bottom: 18px; }
    .quote-text { font-family: 'Instrument Serif', serif; font-size: clamp(38px, 6vw, 76px); line-height: 1.04; letter-spacing: -.02em; color: var(--text-primary); max-width: 880px; }
    .quote-text em { font-style: italic; color: var(--accent-alt); }
    .quote-attr { font-size: 16px; color: var(--text-secondary); max-width: 480px; margin-top: 26px; text-wrap: pretty; }

    /* ── Work ── */
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .work-card { position: relative; aspect-ratio: 4/5; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-solid); cursor: pointer; margin: 0; transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1), border-color .25s; }
    .work-card:hover { border-color: var(--accent-alt); }
    .work-img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.16,1,.3,1); }
    .work-video { transform: scale(1); }
    .work-card:hover .work-video { transform: scale(1.04); }
    .work-empty { width: 100%; height: 100%; background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 11px, var(--card) 11px, var(--card) 22px); }
    .work-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; background: linear-gradient(180deg, rgba(21,16,15,.15) 0%, transparent 35%, rgba(21,16,15,.82)); pointer-events: none; }
    .work-play { align-self: flex-end; color: #F1E8E2; opacity: .82; transition: transform .3s, opacity .3s; }
    .work-card:hover .work-play { transform: scale(1.1); opacity: 1; }
    .work-sound { align-self: flex-end; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 100px; background: rgba(21,16,15,.66); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.14); color: #F1E8E2; font-size: 12px; font-weight: 600; }
    .work-sound.on { background: var(--accent); border-color: transparent; }
    .work-sound-label { letter-spacing: .01em; }
    .work-video { cursor: pointer; }
    .work-cap { display: flex; flex-direction: column; gap: 2px; }
    .work-label { font-size: 16px; font-weight: 700; color: #F6EFE9; }
    .work-meta { font-size: 12.5px; font-weight: 500; color: var(--accent-alt); letter-spacing: .03em; }

    /* ── Services ── */
    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; margin-top: 50px; }
    .services-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .services-note { margin-top: 26px; font-size: 15px; color: var(--text-secondary); }
    .services-note::before { content: ''; display: inline-block; width: 22px; height: 1px; background: var(--accent-alt); vertical-align: middle; margin-right: 12px; }
    .service-card { background: var(--surface); border: 1px solid var(--border-solid); border-radius: 16px; padding: 30px; transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1), border-color .25s, background .25s; }
    .service-card:hover { border-color: var(--accent-alt); background: var(--card); }
    .service-num { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; color: var(--accent-alt); }
    .service-title { font-size: 18.5px; font-weight: 700; color: var(--text-primary); margin: 12px 0 9px; }
    .service-desc { font-size: 14.5px; color: var(--text-secondary); line-height: 1.6; text-wrap: pretty; }

    /* ── Press / references ── */
    .press-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 50px; }
    .press-card { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--border-solid); border-radius: 16px; padding: 28px 30px; transition: border-color .25s, background .25s, transform .25s; }
    .press-card:hover { border-color: var(--accent-alt); background: var(--card); transform: translateY(-3px); }
    .press-tag { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-alt); }
    .press-title { font-family: 'Instrument Serif', serif; font-size: 25px; line-height: 1.18; color: var(--text-primary); }
    .press-arrow { display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-top: 4px; }
    .press-card:hover .press-arrow { color: var(--text-primary); }

    /* ── Contact ── */
    .contact-section { overflow: hidden; }
    .contact-inner { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; text-align: center; }
    .contact-heading { font-size: clamp(32px, 4.6vw, 56px); font-weight: 700; line-height: 1.08; letter-spacing: -.02em; color: var(--text-primary); margin-bottom: 16px; }
    .contact-desc { font-size: 16.5px; color: var(--text-secondary); margin-bottom: 38px; max-width: 480px; margin-left: auto; margin-right: auto; text-wrap: pretty; }
    .contact-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-input { flex: 1; min-width: 0; }
    .form-input { width: 100%; background: var(--surface); border: 1px solid var(--border-solid); border-radius: 11px; padding: 15px 17px; font-size: 14.5px; color: var(--text-primary); outline: none; transition: border-color .2s, background .2s; }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus { border-color: var(--accent-alt); background: var(--card); }
    .form-textarea { resize: vertical; min-height: 108px; }
    select.form-input { appearance: none; cursor: pointer; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%237C6960' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 18px center; padding-right: 42px; }
    .form-note { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 6px; }
    .form-note a { color: var(--accent-alt); font-weight: 600; }
    .form-note a:hover { text-decoration: underline; }
    .sent-confirmation { text-align: center; padding: 56px 0; animation: fadeIn .5s ease; }
    .sent-icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #F1E8E2; background: var(--accent); }
    .sent-confirmation p { font-size: 18px; color: var(--text-secondary); }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    /* ── Footer ── */
    .site-footer { border-top: 1px solid var(--border-solid); padding: 44px 40px 32px; max-width: 1240px; margin: 0 auto; }
    .footer-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; flex-wrap: wrap; }
    .footer-logo { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 16px; color: var(--text-primary); margin-bottom: 10px; }
    .footer-logo .logo-mark { width: 30px; height: 30px; }
    .footer-tag { font-size: 13.5px; color: var(--text-muted); max-width: 360px; }
    .footer-links { display: flex; gap: 24px; font-size: 14.5px; font-weight: 500; color: var(--text-secondary); }
    .footer-links a:hover { color: var(--accent-alt); }
    .footer-copy { margin-top: 36px; font-size: 12.5px; color: var(--text-muted); }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      .hero-wrap { grid-template-columns: 1fr; gap: 48px; }
      .hero-portrait { max-width: 380px; }
      .floating-badge { backdrop-filter: blur(14px); }
      .badge-1 { left: 0; } .badge-2 { right: 0; }
      .about-layout { grid-template-columns: 1fr; gap: 56px; }
      .about-photo { max-width: 380px; }
      .work-grid { grid-template-columns: repeat(2, 1fr); }
      .services-grid-3 { grid-template-columns: 1fr; }
      .press-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .top-nav, .section, .site-footer { padding-left: 22px; padding-right: 22px; }
      .top-nav { padding-top: 14px; padding-bottom: 14px; }
      .hero { padding: 120px 22px 70px; }
      .nav-links a:not(.nav-cta) { display: none; }
      .section { padding-top: 84px; padding-bottom: 84px; }
      .hero-stats-row { gap: 18px; }
      .stat-divider { display: none; }
      .form-row { flex-direction: column; }
      .work-grid { grid-template-columns: 1fr; }
      .quote-overlay { background: linear-gradient(180deg, rgba(21,16,15,.6), rgba(21,16,15,.92)); }
      .footer-inner { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
